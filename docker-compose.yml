services:

  # ── PostgreSQL 15 ───────────────────────────────────────────────────────────
  # Phase 1: FastAPI 앱은 Windows 호스트에서 직접 실행 (WASAPI 캡처 제약)
  # Phase 2: FastAPI 앱 컨테이너 추가 예정
  db:
    image: postgres:15-alpine        # Alpine = 경량 리눅스 베이스
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"        # 로컬에서 DB GUI(DBeaver, TablePlus 등)로 직접 접속 가능
    volumes:
      # named volume: 컨테이너 삭제해도 DB 데이터 유지됨
      # docker-compose down -v 하면 데이터까지 삭제되니 주의
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # pg_isready: PostgreSQL이 실제로 연결을 받을 수 있는 상태인지 확인
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s         # 5초마다 체크
      timeout: 5s          # 5초 안에 응답 없으면 실패
      retries: 5           # 5번 실패하면 unhealthy로 판정
    restart: unless-stopped

  # ── Redis (Phase 2 — Celery 전환 시 주석 해제) ──────────────────────────────
  # redis:
  #   image: redis:7-alpine
  #   ports:
  #     - "6379:6379"
  #   restart: unless-stopped

volumes:
  postgres_data:    # DB 데이터 영구 보관
