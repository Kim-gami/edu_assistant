services:

  # ── PostgreSQL ───────────────────────────────────────────────────────────────
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── Ollama (Qwen2.5-7B-Instruct) ─────────────────────────────────────────────
  # 이미 받은 모델을 볼륨 마운트로 재사용 (재다운로드 없음)
  ollama:
    image: ollama/ollama
    ports:
      - "11434:11434"
    volumes:
      - C:/Users/user/.ollama:/root/.ollama
    restart: unless-stopped

  # ── FastAPI 앱 ────────────────────────────────────────────────────────────────
  app:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      DB_HOST: db
      LLM_BASE_URL: http://ollama:11434/v1
      UPLOAD_DIR: /app/uploads
    volumes:
      # 이미 받은 faster-whisper 모델 캐시 재사용
      - C:/Users/user/.cache/huggingface:/root/.cache/huggingface
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres_data:
  uploads:
