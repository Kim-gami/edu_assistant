{% extends "base.html" %}
{% block title %}Job #{{ job_id }} — 결과{% endblock %}

{% block content %}
<div class="flex items-center justify-between mb-8">
  <div>
    <p class="text-sm text-slate-400 mb-1">작업 번호</p>
    <h1 class="text-2xl font-bold text-slate-800">Job #{{ job_id }}</h1>
  </div>
  <a href="/" class="text-sm text-indigo-500 hover:text-indigo-700 transition-colors">&larr; 홈으로</a>
</div>

<!-- 초기 로딩 후 HTMX가 status fragment로 교체 (outerHTML swap) -->
<div id="status-container"
     hx-get="/fragments/status/{{ job_id }}"
     hx-trigger="load"
     hx-swap="outerHTML">
  <div class="flex items-center justify-center py-20 text-slate-400">
    <svg class="animate-spin h-6 w-6 mr-3 text-indigo-400" fill="none" viewBox="0 0 24 24">
      <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
      <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
    </svg>
    로딩 중...
  </div>
</div>
{% endblock %}
