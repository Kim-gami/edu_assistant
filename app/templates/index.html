{% extends "base.html" %}
{% block title %}강의 퀴즈 생성{% endblock %}

{% block content %}
<div class="text-center py-16">
  <h1 class="text-3xl font-bold text-slate-800 mb-3">강의 퀴즈 생성기</h1>
  <p class="text-slate-400 mb-12">시스템 오디오를 캡처해 자동으로 퀴즈를 생성합니다.</p>

  {% if active_job_id %}
  <!-- 캡처 진행 중 -->
  <div class="inline-block bg-white border border-amber-200 rounded-2xl p-8 shadow-sm text-left">
    <div class="flex items-center gap-3 mb-6">
      <span class="w-3 h-3 bg-red-500 rounded-full animate-pulse"></span>
      <span class="font-semibold text-slate-700">캡처 진행 중 &mdash; Job #{{ active_job_id }}</span>
    </div>
    <div class="flex gap-3">
      <button onclick="stopCapture(this)"
              class="px-5 py-2.5 bg-red-500 text-white rounded-lg font-medium hover:bg-red-600 active:scale-95 transition-all">
        캡처 중지
      </button>
      <a href="/jobs/{{ active_job_id }}"
         class="px-5 py-2.5 bg-white border border-slate-200 text-slate-600 rounded-lg font-medium hover:bg-slate-50 transition-colors">
        결과 보기
      </a>
    </div>
  </div>

  {% else %}
  <!-- 캡처 시작 -->
  <button onclick="startCapture(this)"
          class="px-10 py-4 bg-indigo-600 text-white text-lg font-semibold rounded-2xl shadow-md hover:bg-indigo-700 active:scale-95 transition-all">
    캡처 시작
  </button>
  <p class="mt-4 text-sm text-slate-400">버튼을 누르면 시스템 오디오 캡처가 시작됩니다.</p>
  {% endif %}
</div>

<script>
async function startCapture(btn) {
  btn.disabled = true;
  btn.textContent = '시작 중...';
  try {
    const res = await fetch('/api/v1/capture/start', { method: 'POST' });
    const data = await res.json();
    if (!res.ok) { alert(data.detail || '캡처 시작 실패'); btn.disabled = false; btn.textContent = '캡처 시작'; return; }
    window.location.href = `/jobs/${data.job_id}`;
  } catch (e) {
    alert('서버 오류: ' + e.message);
    btn.disabled = false;
    btn.textContent = '캡처 시작';
  }
}

async function stopCapture(btn) {
  btn.disabled = true;
  btn.textContent = '중지 중...';
  try {
    const res = await fetch('/api/v1/capture/stop', { method: 'POST' });
    if (!res.ok) { const d = await res.json(); alert(d.detail || '중지 실패'); btn.disabled = false; btn.textContent = '캡처 중지'; return; }
    window.location.reload();
  } catch (e) {
    alert('서버 오류: ' + e.message);
    btn.disabled = false;
    btn.textContent = '캡처 중지';
  }
}
</script>
{% endblock %}
